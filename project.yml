name: IntentCapture
options:
  bundleIdPrefix: in.aklabs
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    PRODUCT_NAME: IntentCapture
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  IntentCapture:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/IntentCapture
    resources:
      - path: Resources
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.aklabs.intentcapture
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/IntentCapture.entitlements
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    dependencies: []

schemes:
  IntentCapture:
    build:
      targets:
        IntentCapture: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
